<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЧЕРНОБЫЛЬ — ЗОНА: КВЕСТ</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#050705;color:#ddd;font-family:Arial,sans-serif}
button{font:inherit}
#app{max-width:850px;margin:auto;min-height:100vh;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293329;padding:10px 0 15px;margin-bottom:18px}
.logo{color:#9bb875;font-weight:bold;letter-spacing:2px}
.music{background:#101510;border:1px solid #394535;color:#9bb875;padding:8px 12px;border-radius:6px;cursor:pointer}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}
.stat{background:#0d120d;border:1px solid #222b22;border-radius:6px;padding:8px;text-align:center;font-size:11px;color:#7d8778}
.stat b{display:block;color:#d4dccf;font-size:14px;margin-top:3px}
.story{background:#0b100b;border:1px solid #293329;border-radius:10px;padding:20px}
.chapter{color:#9caf7b;font-size:10px;letter-spacing:2px;font-weight:bold;margin-bottom:9px}
h1{font-size:28px;text-transform:uppercase;margin-bottom:12px}
.text{color:#9aa398;font-size:14px;line-height:1.75;white-space:pre-line}
.actions{display:grid;gap:9px;margin-top:20px}
.action{background:#111811;border:1px solid #354333;color:#d9e1d5;padding:13px;text-align:left;border-radius:7px;cursor:pointer}
.action:hover{background:#182018;border-color:#8cae68}
.action small{display:block;color:#697466;margin-top:4px}
.log{margin-top:15px;border-top:1px solid #222b22;padding-top:12px;color:#667064;font-size:11px}
.inventory{margin-top:15px;display:flex;gap:6px;flex-wrap:wrap}
.item{background:#131913;border:1px solid #293329;padding:6px 9px;border-radius:5px;color:#aab5a5;font-size:11px}
.hidden{display:none}
.start{text-align:center;padding:55px 15px}
.start h1{font-size:42px;color:#dce4d8}
.start span{color:#92ad6e}
.start p{max-width:580px;margin:15px auto;color:#7e877c;line-height:1.7}
.start button{background:#7c965e;border:0;color:#081007;padding:14px 25px;border-radius:7px;font-weight:bold;cursor:pointer}
.end{margin-top:20px;padding:16px;border:1px solid #394535;background:#111711;border-radius:7px;color:#b7c2b2}
@media(max-width:500px){.status{grid-template-columns:repeat(2,1fr)}.start h1{font-size:32px}h1{font-size:23px}}
</style>
</head>

<body>
<div id="app">

<header>
<div class="logo">☢ ЧЕРНОБЫЛЬ / ЗОНА</div>
<button class="music" id="musicBtn">♪ МУЗЫКА</button>
</header>

<audio id="music" loop preload="auto">
<source src="./music.mp3" type="audio/mpeg">
</audio>

<div id="start" class="start">
<h1>ЧЕРНОБЫЛЬ<br><span>ЗОНА ОТЧУЖДЕНИЯ</span></h1>
<p>
Интерактивная квестовая история.
Ты принимаешь решения за Пашу.
Каждый выбор может изменить отношения,
события и финал.
</p>
<button onclick="startGame()">НАЧАТЬ ИСТОРИЮ</button>
</div>

<div id="game" class="hidden">

<div class="status">
<div class="stat">ЗДОРОВЬЕ<b id="hp">100</b></div>
<div class="stat">РАДИАЦИЯ<b id="rad">0</b></div>
<div class="stat">ДЕНЬГИ<b id="money">8000000</b></div>
<div class="stat">ОТНОШЕНИЯ<b id="trust">50</b></div>
</div>

<div class="story">
<div class="chapter" id="chapter"></div>
<h1 id="title"></h1>
<div class="text" id="text"></div>

<div class="actions" id="actions"></div>

<div class="inventory" id="inventory"></div>
<div class="log" id="log"></div>
</div>

<div id="ending" class="end hidden"></div>

</div>
</div>

<script>
const music=document.getElementById("music");
const musicBtn=document.getElementById("musicBtn");

musicBtn.onclick=async()=>{
 try{
  if(music.paused){
   await music.play();
   musicBtn.textContent="♫ МУЗЫКА: ВКЛ";
  }else{
   music.pause();
   musicBtn.textContent="♪ МУЗЫКА";
  }
 }catch(e){
  musicBtn.textContent="⚠ MUSIC.MP3";
 }
};

let state={
 hp:100,
 rad:0,
 money:8000000,
 trust:50,
 items:[],
 flags:{},
 step:0
};

function startGame(){
 document.getElementById("start").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 scene("s1");
 try{music.play().then(()=>musicBtn.textContent="♫ МУЗЫКА: ВКЛ").catch(()=>{})}catch(e){}
}

function has(x){return state.items.includes(x)}
function item(x){if(!has(x))state.items.push(x)}
function flag(x){state.flags[x]=true}

function change(hp=0,rad=0,money=0,trust=0){
 state.hp=Math.max(0,state.hp+hp);
 state.rad=Math.max(0,state.rad+rad);
 state.money=Math.max(0,state.money+money);
 state.trust=Math.max(0,Math.min(100,state.trust+trust));
}

const scenes={

s1:{
 c:"ГЛАВА 01 • МОСКВА",
 t:"Восемь миллионов",
 x:`Паша просыпается после шумной вечеринки.
В квартире беспорядок.

Он открывает сейф.

Пусто.

Восемь миллионов рублей исчезли.

Лёха утверждает, что видел ночью незнакомого человека.
Настя пытается восстановить события вечера.

Телефон Паши вибрирует.

Неизвестный номер.

«Если хотите вернуть деньги — ищите его в Чернобыле».`,
 a:[
  ["Позвонить на неизвестный номер","Паша пытается выяснить, кто оставил сообщение.",()=>scene("s2")],
  ["Позвонить Лёхе","Сначала собрать команду.",()=>{change(0,0,0,5);scene("s3")}],
  ["Никому не говорить","Начать собственное расследование.",()=>{flag("alone");scene("s4")}]
 ]},

s2:{
 c:"ГЛАВА 01",
 t:"Неизвестный",
 x:`На звонок отвечает мужчина.

— Костенко?

Несколько секунд тишины.

— Если ты знаешь это имя, ты уже слишком близко.

Связь обрывается.

На экране появляется сообщение:
«Припять. Старый автовокзал. Завтра. 23:00».`,
 a:[
  ["Показать сообщение друзьям",()=>{change(0,0,0,5);scene("s3")}],
  ["Удалить сообщение",()=>{flag("secret");scene("s4")}]
 ]},

s3:{
 c:"ГЛАВА 02 • ДОРОГА",
 t:"Пятеро",
 x:`Паша, Лёха, Настя, Аня и Гоша собираются вместе.

Никто до конца не понимает, зачем им ехать в Чернобыль.

Но деньги — настоящие.

И человек, который их украл, явно хочет, чтобы они последовали за ним.

Перед поездкой нужно решить, что взять.`,
 a:[
  ["Взять аптечку",()=>{item("Аптечка");scene("s5")}],
  ["Взять старый фотоаппарат",()=>{item("Фотоаппарат");change(0,0,0,3);scene("s5")}],
  ["Ничего не брать",()=>{scene("s5")}]
 ]},

s4:{
 c:"ГЛАВА 02 • РАССЛЕДОВАНИЕ",
 t:"След",
 x:`Паша изучает последние звонки.

Один номер повторяется несколько раз.

Костенко.

Имя кажется знакомым, хотя Паша не может понять почему.

В архиве он находит старую фотографию:
человек в форме КГБ стоит возле четвёртого блока.

На обороте дата:

26.04.1986.`,
 a:[
  ["Сфотографировать снимок",()=>{item("Фото КГБ");scene("s3")}],
  ["Забрать оригинал",()=>{item("Архив КГБ");change(0,0,0,-3);scene("s3")}]
 ]},

s5:{
 c:"ГЛАВА 03 • ЗОНА",
 t:"Припять",
 x:`Ночь.

Припять встречает их пустыми улицами.

Гоша замечает следы автомобиля.

След ведёт к старому зданию.

Вдруг раздаётся металлический звук.

Кто-то находится внутри.`,
 a:[
  ["Войти через дверь",()=>{change(-5,5,0,2);scene("s6")}],
  ["Обойти здание",()=>{change(0,2,0,4);scene("s7")}],
  ["Позвать человека",()=>{scene("s8")}]
 ]},

s6:{
 c:"ГЛАВА 03",
 t:"Бункер",
 x:`Внутри темно.

На стене — старые документы.

Гоша включает фонарь.

Паша замечает надпись:

«НЕ ПЫТАЙТЕСЬ ИЗМЕНИТЬ 1986».

На столе лежит странное устройство.

Оно работает.`,
 a:[
  ["Взять устройство",()=>{item("Устройство");change(0,5,0,2);scene("s9")}],
  ["Оставить его",()=>{scene("s9")}]
 ]},

s7:{
 c:"ГЛАВА 03",
 t:"Старый двор",
 x:`Вы обходите здание.

На земле лежит рация.

Она неожиданно включается.

— Паша?

Это голос Костенко.

— Если ты меня слышишь, не верь тому, что увидишь.`,
 a:[
  ["Ответить",()=>{change(0,0,0,5);scene("s9")}],
  ["Выключить рацию",()=>{flag("silent");scene("s9")}]
 ]},

s8:{
 c:"ГЛАВА 03",
 t:"Незнакомец",
 x:`Из здания выходит мужчина.

Он смотрит на Пашу.

— Вы слишком поздно.

— Где деньги?

Мужчина усмехается.

— Деньги никогда не были главным.`,
 a:[
  ["Спросить про Костенко",()=>{scene("s9")}],
  ["Потребовать деньги",()=>{change(-10,0,0,-5);scene("s9")}],
  ["Уйти",()=>{change(0,0,0,3);scene("s9")}]
 ]},

s9:{
 c:"ГЛАВА 04 • 1986",
 t:"Машина времени",
 x:`Устройство активируется.

Комната исчезает.

Паша падает на бетон.

Снаружи слышны сирены.

На календаре:

26 апреля 1986 года.

Перед ним стоит молодой Сергей Костенко.

Он ещё не знает, что через несколько часов изменится всё.`,
 a:[
  ["Предупредить Костенко",()=>{flag("warned");change(0,0,0,8);scene("s10")}],
  ["Ничего не говорить",()=>{scene("s10")}],
  ["Попытаться остановить события",()=>{flag("changed");change(-15,10,0,-5);scene("s10")}]
 ]},

s10:{
 c:"ГЛАВА 04",
 t:"Костенко",
 x:`Костенко смотрит прямо на Пашу.

— Ты пришёл из будущего?

Паша молчит.

— Тогда ты должен понимать главное.

Костенко показывает на четвёртый блок.

— Некоторые вещи нельзя исправить.

Но Паша уже понимает:
Костенко сам собирается изменить историю.`,
 a:[
  ["Помочь Костенко",()=>{flag("kost_help");change(0,5,0,15);scene("s11")}],
  ["Остановить Костенко",()=>{flag("kost_stop");change(-10,5,0,-5);scene("s11")}],
  ["Вернуться в своё время",()=>{scene("s12")}]
 ]},

s11:{
 c:"ГЛАВА 05 • РАЗВИЛКА",
 t:"Цена прошлого",
 x:`Временная линия начинает разрушаться.

Паша видит несколько вариантов будущего.

В одном из них Зоны вообще нет.

В другом Припять превращена в огромный закрытый город.

В третьем Костенко победил.

Но каждый вариант требует жертвы.`,
 a:[
  ["Спасти друзей",()=>{flag("friends");change(-10,5,0,20);scene("s12")}],
  ["Спасти Костенко",()=>{flag("saved_k");change(0,5,0,10);scene("s12")}],
  ["Спасти будущее",()=>{flag("future");change(-25,15,0,0);scene("s12")}]
 ]},

s12:{
 c:"ФИНАЛ",
 t:"Последняя точка",
 x:`Паша снова открывает глаза.

Припять.

Но что-то изменилось.

Он смотрит на друзей.

Они живы.

Вдалеке стоит человек.

Костенко.

И впервые за всю историю он не пытается убежать.

Он просто смотрит на Пашу.

Теперь осталось решить последнее.`,
 a:[
  ["Остаться в Зоне",()=>ending("zone")],
  ["Вернуться домой",()=>ending("home")],
  ["Уничтожить устройство",()=>ending("destroy")]
 ]}
};

function scene(id){
 state.step++;
 const s=scenes[id];
 document.getElementById("chapter").textContent=s.c;
 document.getElementById("title").textContent=s.t;
 document.getElementById("text").textContent=s.x;
 const box=document.getElementById("actions");
 box.innerHTML="";
 s.a.forEach((a,i)=>{
  const b=document.createElement("button");
  b.className="action";
  b.innerHTML=(i+1)+". "+a[0];
  b.onclick=a[a.length-1];
  box.appendChild(b);
 });
 update();
 window.scrollTo(0,0);
}

function update(){
 document.getElementById("hp").textContent=state.hp;
 document.getElementById("rad").textContent=state.rad;
 document.getElementById("money").textContent=state.money.toLocaleString("ru-RU");
 document.getElementById("trust").textContent=state.trust;
 document.getElementById("inventory").innerHTML=state.items.map(x=>`<span class="item">▣ ${x}</span>`).join("");
 document.getElementById("log").textContent="Пройдено решений: "+state.step;
}

function ending(type){
 let title="",text="";
 if(type==="zone"){
  title="КОНЦОВКА: ЧЕЛОВЕК ЗОНЫ";
  text=state.flags.kost_help?
  "Паша остаётся в Зоне. Костенко исчезает, а устройство продолжает работать. История ещё не закончена.":
  "Паша остаётся в Припяти. Он знает слишком много, чтобы просто вернуться домой.";
 }
 if(type==="home"){
  title="КОНЦОВКА: ВОЗВРАЩЕНИЕ";
  text=state.flags.friends?
  "Паша возвращается вместе с друзьями. Деньги уже не имеют прежнего значения. Главное — никто не остался в прошлом.":
  "Паша возвращается домой один. Он сохранил жизнь, но навсегда запомнил то, что произошло.";
 }
 if(type==="destroy"){
  title="КОНЦОВКА: ПОСЛЕДНИЙ ВЫБОР";
  text=state.flags.changed?
  "Паша уничтожает устройство. Временная петля разрывается. Но он уже никогда не узнает, каким стало бы другое будущее.":
  "Устройство уничтожено. Зона остаётся в прошлом. Теперь изменить историю уже невозможно.";
 }
 document.getElementById("ending").classList.remove("hidden");
 document.getElementById("ending").innerHTML="<b>"+title+"</b><br><br>"+text+
 "<br><br><button class='action' onclick='location.reload()'>НАЧАТЬ ЗАНОВО</button>";
 document.getElementById("actions").innerHTML="";
 update();
}

</script>
</body>
</html>
